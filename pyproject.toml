[project]
name = "vendor-vs-valor"
version = "0.1.0"
description = "Vendor vs Valor advisory research engine (MVP). LangGraph orchestration, Gemini behind a provider interface, grounded citations."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    # Orchestration: graph, interrupt() gates, checkpointer-backed resume
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    # Model provider (default = Gemini), behind our own interface
    "google-genai>=1.0",
    # Schemas for Claim / profile + structured-output contracts
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    # Retrieval: discover (DuckDuckGo) + fetch full page content + extract main text
    "ddgs>=8.0",
    "httpx>=0.27",
    "trafilatura>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# No package to build yet; this keeps `uv sync` from erroring on layout before /skills exists.
bypass-selection = true

[tool.pytest.ini_options]
# Top-level packages (rubric/, skills/, agents/) import from the repo root.
pythonpath = ["."]
testpaths = ["tests"]
